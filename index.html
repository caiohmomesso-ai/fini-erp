<style>
:root{
  --ground:#F3F1F5; --surface:#FFFFFF; --surface-2:#FAF8FB;
  --line:#E4DFE8; --line-strong:#CFC7D6;
  --ink:#1C1421; --ink-2:#574D60; --ink-3:#8A7F94;
  --accent:#D01B54; --accent-soft:#FCE9F0; --accent-ink:#FFFFFF;
  --violet:#4C2A6E;
  --ok:#0F7A57; --ok-soft:#E1F3EC;
  --warn:#A45B00; --warn-soft:#FBEEDC;
  --crit:#B32424; --crit-soft:#FBE8E8;
  --shadow:0 1px 2px rgba(28,20,33,.06), 0 8px 24px -12px rgba(28,20,33,.18);
  --radius:12px; --maxw:1200px;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141018; --surface:#1D1724; --surface-2:#251E2E;
    --line:#332A3D; --line-strong:#473B54;
    --ink:#F2EDF5; --ink-2:#B6AAC0; --ink-3:#857891;
    --accent:#FF5C8A; --accent-soft:#3A1626; --accent-ink:#21101A;
    --violet:#B98CE0;
    --ok:#3FBF93; --ok-soft:#12302699;
    --warn:#E0A047; --warn-soft:#33240F99;
    --crit:#F2706B; --crit-soft:#35171799;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  }
}
:root[data-theme="dark"]{
  --ground:#141018; --surface:#1D1724; --surface-2:#251E2E;
  --line:#332A3D; --line-strong:#473B54;
  --ink:#F2EDF5; --ink-2:#B6AAC0; --ink-3:#857891;
  --accent:#FF5C8A; --accent-soft:#3A1626; --accent-ink:#21101A;
  --violet:#B98CE0;
  --ok:#3FBF93; --ok-soft:#12302699;
  --warn:#E0A047; --warn-soft:#33240F99;
  --crit:#F2706B; --crit-soft:#35171799;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Archivo",sans-serif;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--ground) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand .mark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--accent)}
.brand .sub{font-size:12px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.off{background:var(--crit)}
.who{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 6px 4px 10px;font-size:12.5px;color:var(--ink-2)}
.who input{border:0;background:transparent;width:88px;font-size:12.5px;font-weight:600;color:var(--ink);outline:none}

nav.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;overflow:auto}
nav.tabs button{border:0;background:transparent;padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:26px 0 16px}
.page-head h1{font-size:clamp(23px,3.4vw,30px)}
.page-head p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px;max-width:62ch}
.spacer{margin-left:auto}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line-strong);border-radius:var(--radius);padding:12px 14px;background:var(--surface-2);margin-bottom:18px}
.banner .tag{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--violet);border:1px solid color-mix(in srgb,var(--violet) 35%,transparent);padding:2px 7px;border-radius:5px}
.banner p{margin:0;font-size:13.5px;color:var(--ink-2);flex:1;min-width:200px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(166px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:23px;font-weight:600;letter-spacing:-.03em;margin-top:5px;line-height:1.1}
.tile .v small{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:3px}
.tile .m{font-size:12px;color:var(--ink-2);margin-top:4px}
.tile.alert{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft)}
.tile.alert .v{color:var(--warn)}
.tile.pool{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft)}
.tile.pool .v{color:var(--accent)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:180px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px 9px 32px;font-size:14px;outline:none}
.search input:focus{border-color:var(--accent)}
.search span{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45;display:flex}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;font-size:13.5px;font-weight:500}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(14px)}
.switch input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:660px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.code{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.pname{font-weight:600}
.unit{font-size:11px;color:var(--ink-3);margin-left:3px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.mute{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.chip.gran{background:var(--accent-soft);color:var(--accent)}
.zero{color:var(--ink-3)}
tr.grp td{background:var(--surface-2);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--violet);padding:7px 14px}

.count-list{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:1fr 172px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.crow.done{border-color:color-mix(in srgb,var(--ok) 42%,var(--line))}
.crow.diff{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.crow .meta{min-width:0}
.crow .nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.crow .sm{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;align-items:center}
.qty{display:flex;align-items:center;gap:5px}
.qty input{width:100%;text-align:right;border:1px solid var(--line-strong);border-radius:9px;padding:9px 8px;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;background:var(--surface-2);outline:none;min-width:0}
.qty input:focus{border-color:var(--accent);background:var(--surface)}
.qty select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--ink-2)}
.qty .u{font-size:12px;color:var(--ink-3);font-weight:700;width:22px;text-align:center}
.grp-title{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--violet);margin:16px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.grp-title:first-child{margin-top:0}

.progress-bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.progress-bar i{display:block;height:100%;background:var(--accent);transition:width .2s}

.actionbar{position:sticky;bottom:0;z-index:30;margin:16px -16px 0;padding:12px 16px;background:color-mix(in srgb, var(--ground) 92%, transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actionbar .info{font-size:13px;color:var(--ink-2);font-weight:600}

.modal-bg{position:fixed;inset:0;background:rgba(20,14,24,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:640px;padding:20px}
.modal h2{font-size:19px;margin-bottom:4px}
.modal p.lead{margin:0 0 14px;color:var(--ink-2);font-size:13.5px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:14px;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface)}
.field textarea{min-height:170px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.6;resize:vertical}
.field .hint{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center}

.empty{text-align:center;padding:42px 20px;color:var(--ink-2);border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface-2)}
.empty h3{font-size:17px;margin-bottom:6px;color:var(--ink)}
.empty p{margin:0 auto 14px;max-width:46ch;font-size:13.5px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:90vw}
.hist{display:flex;flex-direction:column;gap:8px}
.hitem{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.hitem .hd{font-weight:600;font-size:14px}
.hitem .hs{font-size:12.5px;color:var(--ink-3)}

/* linhas de item no lançamento de movimento */
.mvline{display:grid;grid-template-columns:1fr 96px 66px 30px;gap:8px;align-items:center;margin-bottom:7px}
.mvline .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvline .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.mvline input{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:7px 8px;text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;width:100%;outline:none}
.mvline select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 2px;font-size:12px;font-weight:700;width:100%}
.mvline .x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:4px}
.mvline .x:hover{color:var(--crit)}
.picker{position:relative}
.picker-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:5;max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow)}
.picker-list button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 11px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line)}
.picker-list button:hover{background:var(--surface-2)}
.picker-list button small{display:block;color:var(--ink-3);font-size:11px}

/* ------- relatórios ------- */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 10px;margin-bottom:16px;position:relative}
.chart-card h3{font-size:14px;margin-bottom:2px}
.chart-card .csub{font-size:12.5px;color:var(--ink-2);margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.tip{position:absolute;pointer-events:none;z-index:10;background:var(--ink);color:var(--ground);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:var(--shadow);white-space:nowrap;opacity:0;transition:opacity .1s}
.tip b{font-weight:700}
.tip .tl{display:flex;align-items:center;gap:6px;justify-content:space-between;gap:14px}
.tip .tl i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.bar-cell{position:relative;min-width:90px}
.bar-cell i{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.75}
.rank{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);width:22px;display:inline-block}
tr.destaque td{background:var(--accent-soft)}
tr.destaque td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .page-head{margin:18px 0 14px}
  .crow{grid-template-columns:1fr 150px}
  .grid2,.grid3{grid-template-columns:1fr}
  .mvline{grid-template-columns:1fr 84px 60px 26px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark">FINI</span><span class="sub">Estoque</span></div>
    <span class="status"><span class="dot" id="dot"></span><span id="statusTxt">carregando…</span></span>
    <label class="who" title="Quem está operando">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="5" r="2.6"/><path d="M2.5 14c0-3 2.5-4.6 5.5-4.6S13.5 11 13.5 14"/></svg>
      <input id="respInput" placeholder="seu nome" autocomplete="off">
    </label>
  </div>
  <div class="top-in" style="padding-top:0">

      <button role="tab" data-view="estoque" aria-selected="true">Estoque</button>
      <button role="tab" data-view="movimentos" aria-selected="false">Movimentos</button>
      <button role="tab" data-view="relatorios" aria-selected="false">Relatórios</button>
      <button role="tab" data-view="inteligencia" aria-selected="false">Inteligência</button>
      <button role="tab" data-view="contagem" aria-selected="false">Contagem</button>
      <button role="tab" data-view="produtos" aria-selected="false">Produtos</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";

/* ================================================================

const el = (tag, attrs, ...kids) => {

  if (attrs) for (const k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];

/* ========================== imagem ==========================
   A foto vive dentro do próprio produto, reduzida a no máximo
   480px e ~80 KB — sem serviço de arquivos, sem link que quebra. */

const FOTO_MAX_PX = 480, FOTO_MAX_KB = 80;

function lerImagem(file){
  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error("sem arquivo"));
    if (!/^image\//.test(file.type)) return reject(new Error("Escolha um arquivo de imagem (JPG, PNG ou WebP)."));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Não deu para ler o arquivo."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Arquivo de imagem inválido."));
      img.onload = () => {
        try {
          const esc = Math.min(1, FOTO_MAX_PX / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width*esc)), h = Math.max(1, Math.round(img.height*esc));
          const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          const ctx = cv.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          let q = 0.8, url = cv.toDataURL("image/jpeg", q);
          while (url.length > FOTO_MAX_KB*1024 && q > 0.32){ q -= 0.1; url = cv.toDataURL("image/jpeg", q); }
          if (url.length > FOTO_MAX_KB*1024*1.6) return reject(new Error("Imagem grande demais mesmo depois de reduzir."));
          resolve(url);
        } catch(e){ reject(new Error("Não deu para processar a imagem.")); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function refContagem(tipo){
  const aps = state.contagens.filter(c => c.tipo===tipo && c.status==="aplicada")
    .sort((a,b)=>String(a.aplicadaEm||"").localeCompare(String(b.aplicadaEm||"")));
  return aps[aps.length-1] || null;
}

function calcSaldos(){
  const out = { fechado:{}, balcao:{}, ref:{fechado:null,balcao:null}, poolGranel:0, poolBase:0, granelNaContagem:{} };
  const prodById = {}; (state.demo?demoProdutos():state.produtos).forEach(p=>prodById[p.id]=p);

  for (const tipo of ["fechado","balcao"]){
    const last = refContagem(tipo);
    if (!last) continue;
    out.ref[tipo] = last;
    for (const k in (last.itens||{})) out[tipo][k] = Number(last.itens[k])||0;
  }
  // base do pool: granel que estava no balcão na última contagem de balcão
  for (const sku in out.balcao){
    const p = prodById[sku];
    if (p && isGranel(p)){ out.poolBase += Number(out.balcao[sku])||0; out.granelNaContagem[sku] = out.balcao[sku]; }
  }
  out.poolGranel = out.poolBase;

  const movs = state.movimentos.slice().sort((a,b)=>String(a.criadoEm||"").localeCompare(String(b.criadoEm||"")));
  for (const m of movs){
    const depoisF = !out.ref.fechado || String(m.criadoEm||"") > String(out.ref.fechado.aplicadaEm||"");
    const depoisB = !out.ref.balcao  || String(m.criadoEm||"") > String(out.ref.balcao.aplicadaEm||"");
    const itens = m.itens || {};
    for (const sku in itens){
      const v = Number(itens[sku])||0;
      const p = prodById[sku];
      const gran = p ? isGranel(p) : false;
      if (m.direcao === "transferencia"){
        if (depoisF) out.fechado[sku] = (out.fechado[sku]||0) - v;
        if (depoisB){
          if (gran) out.poolGranel += v;               // granel vira pool
          else out.balcao[sku] = (out.balcao[sku]||0) + v;
        }
      } else if (m.direcao === "entrada"){
        const loc = m.local || "fechado";
        if (loc === "fechado"){ if (depoisF) out.fechado[sku] = (out.fechado[sku]||0) + v; }
        else if (depoisB){ if (gran) out.poolGranel += v; else out.balcao[sku] = (out.balcao[sku]||0) + v; }
      } else if (m.direcao === "saida"){
        const loc = m.local || "balcao";
        if (loc === "fechado"){ if (depoisF) out.fechado[sku] = (out.fechado[sku]||0) - v; }
        else if (depoisB){ if (gran) out.poolGranel -= v; else out.balcao[sku] = (out.balcao[sku]||0) - v; }
      }
    }
    // venda de granel agregada (sem SKU) — só existe no balcão
    const g = Number(m.granelKg)||0;
    if (g && depoisB){
      if (m.direcao === "saida") out.poolGranel -= g;
      if (m.direcao === "entrada" || m.direcao === "transferencia") out.poolGranel += g;
    }
  }

  if (state.demo){ out.fechado = demoSaldo(); out.ref.fechado = {aplicadaEm:"2026-09-01T11:00:00.000Z", responsavel:"exemplo"}; out.poolGranel = 3.4; }
  return out;
}

/* ---------- adaptador de armazenamento ----------
   1. dentro do Claude  → capacidade db do Artifact
   2. site hospedado    → Supabase (window.FINI_CONFIG + supabase-js)
   3. sem nenhum dos dois → localStorage, só neste aparelho          */

function criarDb(backend){
  const cache = {}, subs = {};
  const snapDoc = (id, data) => ({ id, exists: data !== undefined, data: ()=>data, metadata:{fromCache:false,hasPendingWrites:false} });
  function emit(col){
    const todos = Object.entries(cache[col]||{}).map(([id,d]) => snapDoc(id,d));
    (subs[col]||[]).forEach(s => {
      let arr = todos.slice();
      if (s.ob) arr.sort((a,b)=>{
        const va = String(a.data()[s.ob] ?? ""), vb = String(b.data()[s.ob] ?? "");
        return s.dir === "desc" ? vb.localeCompare(va) : va.localeCompare(vb);
      });
      else arr.sort((a,b)=>a.id.localeCompare(b.id));
      if (s.lim) arr = arr.slice(0, s.lim);
      try { s.cb({ docs:arr, size:arr.length, empty:!arr.length, docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false} }); } catch(e){}
    });
  }
  async function carregar(col){
    try { cache[col] = await backend.load(col); } catch(e){ cache[col] = cache[col] || {}; }
    emit(col);
  }
  backend.aoMudar = col => carregar(col);

  function query(col, ob, dir, lim){
    return {
      orderBy:(f,d)=>query(col,f,d||"asc",lim),
      limit:(n)=>query(col,ob,dir,n),
      doc:(id)=>docRef(col, id || uid("id")),
      get: async ()=>{
        if (!cache[col]) await carregar(col);
        const arr = Object.entries(cache[col]||{}).map(([id,d]) => snapDoc(id,d));
        return { docs:arr, size:arr.length, empty:!arr.length, docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false} };
      },
      onSnapshot:(cb,err)=>{
        (subs[col] = subs[col] || []).push({cb,ob,dir,lim});
        if (cache[col]) emit(col); else carregar(col);
        return ()=>{ subs[col] = subs[col].filter(s=>s.cb!==cb); };
      },
    };
  }
  function docRef(col, id){
    return {
      id, path: col+"/"+id,
      get: async ()=>{ if (!cache[col]) await carregar(col); return snapDoc(id, (cache[col]||{})[id]); },
      set: async (data)=>{ cache[col] = cache[col]||{}; cache[col][id] = data; emit(col); await backend.save(col,id,data); },
      update: async (data)=>{ cache[col] = cache[col]||{}; cache[col][id] = Object.assign({}, cache[col][id]||{}, data); emit(col); await backend.save(col,id,cache[col][id]); },
      delete: async ()=>{ if (cache[col]) delete cache[col][id]; emit(col); await backend.remove(col,id); },
      collection:(sub)=>query(col+"/"+id+"/"+sub),
    };
  }
  return { collection:(c)=>query(c), doc:(p)=>{ const seg = p.split("/"); const id = seg.pop(); return docRef(seg.join("/"), id); } };
}

function backendLocal(){
  const chave = c => "fini.store." + c;
  return {
    async load(c){ try { return JSON.parse(localStorage.getItem(chave(c)) || "{}"); } catch(e){ return {}; } },
    async save(c,id,data){ const t = await this.load(c); t[id] = data; try { localStorage.setItem(chave(c), JSON.stringify(t)); } catch(e){} },
    async remove(c,id){ const t = await this.load(c); delete t[id]; try { localStorage.setItem(chave(c), JSON.stringify(t)); } catch(e){} },
  };
}

function backendSupabase(client, tabela){
  const T = tabela || "fini_docs";
  const b = {
    async load(c){
      const { data, error } = await client.from(T).select("id,dados").eq("colecao", c);
      if (error) throw error;
      const out = {}; (data||[]).forEach(r => out[r.id] = r.dados || {});
      return out;
    },
    async save(c,id,dados){
      const { error } = await client.from(T).upsert({ colecao:c, id, dados, atualizado_em:new Date().toISOString() }, { onConflict:"colecao,id" });
      if (error) throw error;
    },
    async remove(c,id){
      const { error } = await client.from(T).delete().eq("colecao",c).eq("id",id);
      if (error) throw error;
    },
    aoMudar(){},
  };
  try {
    client.channel("fini-docs")
      .on("postgres_changes", { event:"*", schema:"public", table:T }, payload => {
        const col = (payload.new && payload.new.colecao) || (payload.old && payload.old.colecao);
        if (col) b.aoMudar(col);
      })
      .subscribe();
  } catch(e){}
  setInterval(()=>{ ["produtos","contagens","movimentos","config"].forEach(c => b.aoMudar(c)); }, 25000);
  return b;
}

async function abrirArmazenamento(){
  try { const d = await window.claude?.use?.("db"); if (d) return { db:d, modo:"claude" }; } catch(e){}

  const cfg = window.FINI_CONFIG || {};
  const configurado = !!(cfg.supabaseUrl && cfg.supabaseKey);

  if (configurado){
    // o script do Supabase pode ainda estar carregando: espera até 8s
    for (let i = 0; i < 40 && !(window.supabase && window.supabase.createClient); i++){
      await new Promise(r => setTimeout(r, 200));
    }
    if (window.supabase && window.supabase.createClient){
      try {
        const client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
        return { db: criarDb(backendSupabase(client, cfg.tabela)), modo:"supabase" };
      } catch(e){ /* cai no bloqueio abaixo */ }
    }
    // Configurado para o banco compartilhado, mas não deu para chegar nele.
    // NÃO cai para o armazenamento local: trabalhar aqui criaria dados órfãos.
    return { db: null, modo:"falha" };
  }

  return { db: criarDb(backendLocal()), modo:"local" };
}

async function initDb(){
  const { db, modo } = await abrirArmazenamento();
  state.modo = modo;
  if (!db){
    setStatus("off", modo === "falha" ? "não conectou ao banco" : "sem armazenamento");
    state.demo = false; render(); return;
  }
  state.db = db; state.modo = modo;
  setStatus("warn", modo === "local" ? "salvando neste aparelho" : "sincronizando…");

  db.collection("config").onSnapshot(s => {
    const d = s.docs.find(x => x.id === "geral");
    if (d && d.exists) state.config = Object.assign({}, state.config, d.data());
    render();
  }, ()=>{});

  db.collection("produtos").onSnapshot(s => {
    state.produtos = s.docs.map(d => Object.assign({id:d.id}, d.data()));
    state.demo = state.produtos.length === 0;
    setStatus("on", state.modo === "local" ? "salvo neste aparelho" : "sincronizado"); render();
  }, e => setStatus("off","erro: "+(e&&e.code||"")));

  db.collection("contagens").orderBy("criadoEm","desc").limit(60).onSnapshot(s => {
    state.contagens = s.docs.map(d => Object.assign({id:d.id}, d.data())); render();
  }, e => setStatus("off","erro: "+e.code));

  db.collection("movimentos").orderBy("criadoEm","desc").limit(400).onSnapshot(s => {
    state.movimentos = s.docs.map(d => Object.assign({id:d.id}, d.data())); render();
  }, ()=>{});
}

/* mantém o cadastro local em dia na hora, sem esperar o snapshot voltar */
function upsertLocal(id, body){
  const doc = Object.assign({ id }, body);
  const i = state.produtos.findIndex(x => x.id === id);
  if (i >= 0) state.produtos[i] = doc; else state.produtos = state.produtos.concat([doc]);
  state.demo = state.produtos.length === 0;
}

async function salvarProduto(p){
  if (!requireDb()) return;
  const id = p.id || slug(p.codigo || p.nome);
  /* reimportar o catálogo não pode apagar foto, mínimo, prazo e conciliações */
  const atual = state.produtos.find(x => x.id === id) || {};
  const herda = (k, def) => (p[k] !== undefined && p[k] !== null) ? p[k] : (atual[k] !== undefined ? atual[k] : def);
  const body = {
    codigo: p.codigo || id, nome: p.nome || "", categoria: p.categoria || CAT_FALLBACK,
    tipo: p.tipo || "granel", custo: Number(p.custo)||0,
    unPorCaixa: Number(p.unPorCaixa)||0, pesoUn: Number(p.pesoUn)||0,
    codigosAlt: (Array.isArray(herda("codigosAlt", [])) ? herda("codigosAlt", []) : []).slice(0,12),
    estoqueMin: Number(herda("estoqueMin", 0))||0, leadTime: Number(herda("leadTime", 0))||0,
    foto: typeof herda("foto","") === "string" ? herda("foto","") : "",
    ativo: p.ativo !== false, criadoEm: p.criadoEm || atual.criadoEm || new Date().toISOString(),
  };
  await state.db.collection("produtos").doc(id).set(body);
  upsertLocal(id, body);
}

/* liga um código do Degust a um produto que já existe no cadastro */
async function conciliarCodigo(produto, codigo){
  const alt = (produto.codigosAlt||[]).slice();
  if (!alt.some(a => limpaCod(a) === limpaCod(codigo))) alt.push(String(codigo));
  await salvarProduto(Object.assign({}, produto, { codigosAlt: alt }));
}
async function removerProduto(id){ if (requireDb()) await state.db.collection("produtos").doc(id).delete(); }

/* ======================= MANUTENÇÃO =======================
   Apagar, exportar e recarregar o sistema inteiro.
   Também disponível no console como FiniAdmin.               */

const COLECOES = ["produtos","contagens","movimentos","config"];

async function listarDocs(col){
  if (!state.db) return [];
  try {
    const s = await state.db.collection(col).get();
    return s.docs.map(d => ({ id:d.id, dados:d.data() }));
  } catch(e){ return []; }
}

async function apagarColecao(col, onProgresso){
  const docs = await listarDocs(col);
  let n = 0;
  for (const d of docs){
    try { await state.db.collection(col).doc(d.id).delete(); n++; }
    catch(e){ if (e && e.code === "resource_exhausted") await new Promise(r=>setTimeout(r,1200)); }
    if (onProgresso) onProgresso(n, docs.length, col);
    if (n % 15 === 0) await new Promise(r=>setTimeout(r,120));
  }
  return n;
}

async function apagarTudo(cols, onProgresso){
  let total = 0;
  for (const c of cols) total += await apagarColecao(c, onProgresso);
  if (cols.includes("produtos")) state.produtos = [];
  if (cols.includes("contagens")){ state.contagens = []; state.abertaId = null; state.draft = null; }
  if (cols.includes("movimentos")) state.movimentos = [];
  state.demo = state.produtos.length === 0;
  render();
  return total;
}

async function exportarTudo(){
  const saida = { gerado: new Date().toISOString(), versao: 1 };
  for (const c of COLECOES) saida[c] = await listarDocs(c);
  return saida;
}

/* aceita o JSON do backup ou uma lista simples de produtos */
async function importarJSON(txt, substituir, onProgresso){
  let dados;
  try { dados = typeof txt === "string" ? JSON.parse(txt) : txt; }
  catch(e){ throw new Error("O texto não é um JSON válido."); }
  if (Array.isArray(dados)) dados = { produtos: dados.map(p => ({ id: p.id || slug(p.codigo||p.nome), dados: p })) };
  if (substituir) await apagarTudo(COLECOES.filter(c => Array.isArray(dados[c]) && dados[c].length), onProgresso);
  let n = 0, total = 0;
  COLECOES.forEach(c => { if (Array.isArray(dados[c])) total += dados[c].length; });
  for (const c of COLECOES){
    const lista = dados[c]; if (!Array.isArray(lista)) continue;
    for (const item of lista){
      const id = item.id || slug((item.dados && (item.dados.codigo || item.dados.nome)) || uid("d"));
      const corpo = item.dados || item;
      try { await state.db.collection(c).doc(id).set(corpo); n++; }
      catch(e){ if (e && e.code === "resource_exhausted") await new Promise(r=>setTimeout(r,1200)); }
      if (onProgresso) onProgresso(n, total, c);
      if (n % 15 === 0) await new Promise(r=>setTimeout(r,120));
    }
  }
  render();
  return n;
}

    valor += (f+b) * (Number(p.custo)||0);

  }

    tile("Granel fechado", nKg1(granelF), "kg", "no depósito, por sabor"),

    tile("Itens embalados", nUn(itensF), "un", "fechado + balcão"),
    tile("Valor a custo", nBRL(valor), "", "estoque total"),
    semContagem > 0 ? tile("Sem contagem", String(semContagem), "SKUs", "nunca apurados", "alert")
                    : tile("Cobertura", "100", "%", "todos os SKUs contados")));

  }

  const tbody = el("tbody"); let catAtual = null;
  for (const p of lista){

    if (cat !== catAtual && state.filtro.cat === "todas"){ catAtual = cat; tbody.appendChild(el("tr",{class:"grp"}, el("td",{colspan:"8"}, cat))); }
    const gran = isGranel(p);
    const f = s.fechado[p.id];
    const nunca = !(p.id in s.fechado);
    const b = gran ? (s.granelNaContagem[p.id]) : (s.balcao[p.id]||0);
    const tot = (f||0) + (gran ? 0 : (b||0));
    const min = Number(p.estoqueMin)||0;
    const tr = el("tr",null,
      el("td",{class:"code"}, p.codigo || p.id),

        thumb(p, 32), el("div",{class:"pname"}, p.nome))),

      el("td",{class:"r num"}, nunca ? el("span",{class:"zero"},"—") : fmtBase(p,f), el("span",{class:"unit"}, baseUn(p))),
      el("td",{class:"r num", title: gran ? "No balcão este sabor vira "+POOL_NOME : ""},
        gran ? el("span",{class:"zero", style:"font-size:11.5px"}, "vira "+POOL_NOME)
             : ((b||0) === 0 ? el("span",{class:"zero"},"—") : nUn(b))),
      el("td",{class:"r num"}, el("strong",null, fmtBase(p,tot))),
      el("td",{class:"r num"}, nBRL(tot * (Number(p.custo)||0))),
      el("td",null, nunca ? el("span",{class:"chip warn"},"sem contagem")
        : (min > 0 && tot <= min ? el("span",{class:"chip crit"},"abaixo do mínimo")

        el("th",{class:"r"},"Total"), el("th",{class:"r"},"Custo"), el("th",null,"Situação"))),
      tbody)));
  box.appendChild(el("p",{style:"font-size:12px;color:var(--ink-3);margin:10px 2px 0;max-width:74ch"},

  return box;
}

function custoMedioGranel(prods, s){
  let peso = 0, valor = 0;
  for (const p of prods){
    if (!isGranel(p)) continue;
    const q = (s.fechado[p.id]||0);
    peso += q; valor += q * (Number(p.custo)||0);
  }
  return peso > 0 ? valor/peso : 0;
}

/* ============================ LEITURA DE PDF ============================
   O interpretador só é baixado quando você abre o primeiro PDF.        */

let _pdfjs = null;
function carregarPdfJs(){
  if (_pdfjs) return _pdfjs;
  _pdfjs = new Promise((resolve, reject) => {
    if (window.pdfjsLib) return resolve(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      const lib = window.pdfjsLib;
      if (!lib) return reject(new Error("Não deu para carregar o leitor de PDF."));
      try { lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch(e){}
      resolve(lib);
    };
    s.onerror = () => reject(new Error("Sem conexão para carregar o leitor de PDF."));
    document.head.appendChild(s);
  });
  return _pdfjs;
}

/* devolve o texto do PDF já quebrado em linhas, na ordem da página */
async function textoDoPdf(file, onProgresso){
  const lib = await carregarPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await lib.getDocument({ data: buf }).promise;
  const paginas = [];
  for (let p = 1; p <= doc.numPages; p++){
    if (onProgresso) onProgresso(p, doc.numPages);
    const pg = await doc.getPage(p);
    const tc = await pg.getTextContent();
    const linhas = new Map();
    for (const item of tc.items){
      if (!item.str) continue;
      const y = Math.round(item.transform[5]);          // agrupa por altura na página
      const chave = Math.round(y/3)*3;
      const atual = linhas.get(chave) || [];
      atual.push({ x: item.transform[4], t: item.str });
      linhas.set(chave, atual);
    }
    const ordenadas = Array.from(linhas.entries()).sort((a,b)=>b[0]-a[0]);
    for (const [,partes] of ordenadas){
      partes.sort((a,b)=>a.x-b.x);
      const linha = partes.map(p=>p.t).join(" ").replace(/\s{2,}/g," ").trim();
      if (linha) paginas.push(linha);
    }
  }
  return paginas.join("\n");
}

/* botão reutilizável: escolhe um PDF e joga o texto no campo indicado */
function botaoPdf(destino, aoLer){
  const arq = el("input",{type:"file", accept:"application/pdf,.pdf", style:"display:none"});
  const btn = el("button",{class:"btn sm", type:"button", onclick:()=>arq.click()},"Ler de um PDF");
  arq.addEventListener("change", async ()=>{
    const f = arq.files && arq.files[0]; if (!f) return;
    const rotulo = btn.textContent;
    btn.disabled = true; btn.textContent = "Lendo o PDF…";
    try {
      const txt = await textoDoPdf(f, (p,t)=>{ btn.textContent = "Lendo página "+p+" de "+t+"…"; });
      if (destino){ destino.value = txt; destino.dispatchEvent(new Event("input", {bubbles:true})); }
      if (aoLer) aoLer(txt, f);
      toast("PDF lido: " + f.name);
    } catch(err){ toast(err.message || "Não deu para ler o PDF."); }
    btn.disabled = false; btn.textContent = rotulo; arq.value = "";
  });
  return el("span",{style:"display:inline-flex"}, btn, arq);
}

/* ---- entrada de mercadoria a partir de um documento ----
   Varre o texto atrás dos códigos que existem no cadastro e pega a
   quantidade da mesma linha. Funciona com nota, pedido ou romaneio. */

function parseDocumentoEntrada(txt){
  const achados = []; const vistos = {};
  for (const raw of txt.split(/\r?\n/)){
    const linha = raw.trim(); if (!linha) continue;
    const tokens = linha.split(/\s+/);
    let p = null, idx = -1;
    for (let i = 0; i < tokens.length; i++){
      const cand = tokens[i].replace(/[^\w\-.]/g,"");
      if (cand.length < 3) continue;
      const achado = produtoPorCodigo(cand);
      if (achado){ p = achado; idx = i; break; }
    }
    if (!p) continue;
    const numeros = [];
    for (let i = idx+1; i < tokens.length; i++){
      const n = parseNum(tokens[i]);
      if (n !== null && n > 0) numeros.push(n);
    }
    if (!numeros.length) continue;
    const qtd = numeros[0];                       // primeiro número após o código
    const chave = p.id;
    if (vistos[chave] !== undefined){ achados[vistos[chave]].qtd += qtd; continue; }
    vistos[chave] = achados.length;
    achados.push({ p, qtd, linha });
  }
  return achados;
}

/* ------------------ importação de vendas (Degust) ------------------ */

function parseVendas(txt){
  const linhas = txt.split(/\r?\n/);
  const out = []; let periodo = "";
  const reLinha = /^\s*(\d{3,6})\s+(.+?)\s+(KG|UN)\s+([\d.,]+)\s+([\d.,]+)\s+([\d.,]+)/i;
  for (const raw of linhas){
    const l = raw.replace(/\u00a0/g," ");
    const mp = l.match(/Periodo\s+(\d{2}\/\d{2}\/\d{4})\s*[àa]\s*(\d{2}\/\d{2}\/\d{4})/i);
    if (mp){ periodo = mp[1] + " a " + mp[2]; continue; }
    if (/Total\s+(Loja|Geral)/i.test(l)) continue;
    if (/C[óo]d\.?\s*Produto/i.test(l)) continue;
    const m = l.match(reLinha);
    if (!m) continue;
    const [, codigo, nomeRaw, un, qtdRaw, unitRaw, totalRaw] = m;
    const qtd = parseNum(qtdRaw), total = parseNum(totalRaw);
    if (qtd === null) continue;
    out.push({ codigo, nome: nomeRaw.replace(/\s{2,}/g," ").trim(), un: un.toUpperCase(), qtd, valor: total||0 });
  }
  return { periodo, linhas: out };
}

function mapearVendas(res){
  const itens = {}; let granelKg = 0; const naoEncontrados = [];

    if (!p){
      if (L.un === "KG") granelKg += L.qtd;      // agregador de granel sem cadastro

    itens[p.id] = (itens[p.id]||0) + L.qtd;

  return { itens, granelKg, naoEncontrados };
}

/* ============================ RELATÓRIOS ============================ */

const CATS = [
  { key:"venda",  label:"Venda",             cor:"var(--s1)" },
  { key:"transf", label:"Transf. p/ balcão", cor:"var(--s2)" },
  { key:"degust", label:"Degustação",        cor:"var(--s3)" },
  { key:"perda",  label:"Desperdício",       cor:"var(--s4)" },
  { key:"outras", label:"Outras saídas",     cor:"var(--s5)" },
];
const catLabel = k => (CATS.find(c=>c.key===k)||{label:k}).label;

function catDe(m){
  if (m.direcao === "transferencia") return "transf";
  if (m.direcao !== "saida") return null;                // entradas não entram no relatório de saída
  const mo = m.motivo || "outras";
  if (mo === "venda") return "venda";
  if (mo === "degustacao" || mo === "cortesia") return "degust";
  if (mo === "desperdicio" || mo === "quebra") return "perda";
  return "outras";
}

function periodoAtual(){
  const p = state.rel.periodo;
  if (p === "custom") return { de: state.rel.de, ate: state.rel.ate };
  if (p === "tudo") return { de:"", ate:"" };
  const d = new Date();
  const ate = d.toISOString().slice(0,10);
  d.setDate(d.getDate() - (Number(p)-1));
  return { de: d.toISOString().slice(0,10), ate };
}
const dataDoMov = m => String(m.data || m.criadoEm || "").slice(0,10);
function movsPeriodo(){
  const { de, ate } = periodoAtual();
  const base = state.demo ? demoMovimentos() : state.movimentos;
  return base.filter(m => {
    const dt = dataDoMov(m);
    if (de && dt < de) return false;
    if (ate && dt > ate) return false;
    return true;
  });
}
function custoGranelRef(){
  const prods = state.demo ? demoProdutos() : state.produtos;
  const gr = prods.filter(isGranel);
  if (!gr.length) return 0;
  const s = calcSaldos();
  let peso = 0, valor = 0;
  for (const p of gr){ const q = s.fechado[p.id]||0; peso += q; valor += q*(Number(p.custo)||0); }
  if (peso > 0) return valor/peso;
  return gr.reduce((a,p)=>a+(Number(p.custo)||0),0) / gr.length;
}

function agregaPorProduto(movs){
  const prods = state.demo ? demoProdutos() : produtosAtivos();
  const byId = {}; prods.forEach(p => byId[p.id] = p);
  const linhas = {};
  const get = p => linhas[p.id] || (linhas[p.id] = { p, consumo:0, transf:0, porCat:{} });
  let granelVendido = 0, granelOutras = 0;

  for (const m of movs){
    const cat = catDe(m); if (!cat) continue;
    for (const sku in (m.itens||{})){
      const p = byId[sku]; if (!p) continue;
      const q = Number(m.itens[sku])||0;
      const L = get(p);
      if (cat === "transf") L.transf += q; else L.consumo += q;
      L.porCat[cat] = (L.porCat[cat]||0) + q;
    }
    const g = Number(m.granelKg)||0;
    if (g){ if (cat === "venda") granelVendido += g; else if (cat !== "transf") granelOutras += g; }
  }

  const custoG = custoGranelRef();
  const out = prods.map(p => {
    const L = linhas[p.id] || { p, consumo:0, transf:0, porCat:{} };
    const gran = isGranel(p);
    const ref = gran ? L.transf : L.consumo;              // consumo de granel se mede na transferência
    return Object.assign(L, { gran, ref, valor: ref * (Number(p.custo)||0) });
  });
  return { linhas: out, granelVendido, granelOutras, custoG };
}

/* ---------------------- por data ---------------------- */

function agregaPorData(movs){
  const prods = state.demo ? demoProdutos() : state.produtos;
  const byId = {}; prods.forEach(p => byId[p.id] = p);
  const custoG = custoGranelRef();
  const dias = {};
  const get = d => dias[d] || (dias[d] = { data:d, val:{}, kg:0, un:0, total:0, movs:[] });

  for (const m of movs){
    const cat = catDe(m); if (!cat) continue;
    const d = get(dataDoMov(m));
    let v = 0, kg = 0, un = 0;
    for (const sku in (m.itens||{})){
      const p = byId[sku]; const q = Number(m.itens[sku])||0;
      if (!p) continue;
      v += q * (Number(p.custo)||0);
      if (isGranel(p)) kg += q; else un += q;
    }
    const g = Number(m.granelKg)||0;
    if (g){ v += g*custoG; kg += g; }
    d.val[cat] = (d.val[cat]||0) + v;
    d.total += v; d.kg += kg; d.un += un;
    d.movs.push(m);
  }
  return Object.values(dias).sort((a,b)=>a.data.localeCompare(b.data));
}

function relPorData(movs){
  const box = el("div");
  let dias = agregaPorData(movs);
  const agrupaSemana = dias.length > 45;
  if (agrupaSemana) dias = agruparSemanas(dias);

  const totalGeral = dias.reduce((a,d)=>a+d.total,0);
  const porCat = {};
  dias.forEach(d => { for (const k in d.val) porCat[k] = (porCat[k]||0) + d.val[k]; });
  const perda = porCat.perda||0;

const pct = (v,t) => t > 0 ? (v/t*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%" : "0%";

function agruparSemanas(dias){
  const map = {};
  for (const d of dias){
    const dt = new Date(d.data+"T12:00:00");
    const day = (dt.getDay()+6)%7;
    dt.setDate(dt.getDate()-day);
    const k = dt.toISOString().slice(0,10);
    const g = map[k] || (map[k] = { data:k, rotulo:"sem. "+dataBR(k), val:{}, kg:0, un:0, total:0, movs:[] });
    for (const c in d.val) g.val[c] = (g.val[c]||0) + d.val[c];
    g.kg += d.kg; g.un += d.un; g.total += d.total; g.movs = g.movs.concat(d.movs);
  }
  return Object.values(map).sort((a,b)=>a.data.localeCompare(b.data));
}

function graficoDiario(dias, semanal){
  const card = el("div",{class:"chart-card"});
  card.appendChild(el("h3",null,"Saída por "+(semanal?"semana":"dia")+", a custo"));
  card.appendChild(el("p",{class:"csub"},"Cada barra é um "+(semanal?"agrupamento semanal":"dia")+", empilhada pelo motivo da saída. Transferência não é consumo — é o granel indo do depósito para o balcão."));

  const W = 760, H = 250, ML = 56, MR = 12, MT = 12, MB = 34;
  const iw = W-ML-MR, ih = H-MT-MB;
  const max = Math.max(1, ...dias.map(d=>d.total));
  const passo = escalaBonita(max);
  const topo = Math.ceil(max/passo)*passo;
  const bw = Math.max(3, Math.min(30, iw/Math.max(dias.length,1) - 4));
  const gap = dias.length > 1 ? (iw - bw*dias.length)/(dias.length) : 0;
  const xDe = i => ML + gap/2 + i*(bw+gap);
  const y = v => MT + ih - (v/topo)*ih;

  const svg = el("div",{class:"table-wrap", style:"border:0;background:transparent;overflow-x:auto"});
  let s = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:520px;height:auto;display:block" role="img" aria-label="Saída por período, empilhada por motivo">';
  for (let g = 0; g <= 4; g++){
    const v = topo*g/4, yy = y(v);
    s += '<line x1="'+ML+'" y1="'+yy+'" x2="'+(W-MR)+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    s += '<text x="'+(ML-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">'+curto(v)+'</text>';
  }
  dias.forEach((d,i) => {
    let acc = 0;
    const x = xDe(i);
    CATS.forEach(c => {
      const v = d.val[c.key]||0; if (v <= 0) return;
      const y1 = y(acc+v), y0 = y(acc);
      const bruto = y0-y1;
      const h = bruto > 6 ? bruto-2 : Math.max(3, bruto);
      s += '<rect x="'+x.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+c.cor+'"/>';
      acc += v;
    });
    const passoRot = Math.ceil(dias.length/12);
    if (i % passoRot === 0){
      const rot = semanal ? dataBR(d.data).slice(0,5) : dataBR(d.data).slice(0,5);
      s += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">'+rot+'</text>';
    }
  });
  s += '<line x1="'+ML+'" y1="'+(MT+ih)+'" x2="'+(W-MR)+'" y2="'+(MT+ih)+'" stroke="var(--line-strong)" stroke-width="1"/>';
  dias.forEach((d,i) => {
    s += '<rect class="hit" data-i="'+i+'" x="'+(xDe(i)-gap/2).toFixed(1)+'" y="'+MT+'" width="'+(bw+gap).toFixed(1)+'" height="'+ih+'" fill="transparent"/>';
  });
  s += '</svg>';
  svg.innerHTML = s;
  card.appendChild(svg);

  const tip = el("div",{class:"tip"});
  card.appendChild(tip);
  svg.querySelectorAll(".hit").forEach(r => {
    r.addEventListener("mouseenter", ()=>{
      const d = dias[Number(r.dataset.i)];
      let html = '<b>'+(semanal ? d.rotulo : dataBR(d.data))+'</b>';
      CATS.forEach(c => { const v = d.val[c.key]||0; if (v>0) html += '<div class="tl"><span><i style="background:'+c.cor+'"></i>'+c.label+'</span><span>'+nBRL(v)+'</span></div>'; });
      html += '<div class="tl" style="margin-top:4px;border-top:1px solid rgba(255,255,255,.2);padding-top:4px"><span>Total</span><span><b>'+nBRL(d.total)+'</b></span></div>';
      tip.innerHTML = html; tip.style.opacity = "1";
    });
    r.addEventListener("mousemove", (e)=>{
      const box = card.getBoundingClientRect();
      const x = e.clientX - box.left, yy = e.clientY - box.top;
      tip.style.left = Math.min(Math.max(8, x+14), box.width - tip.offsetWidth - 8) + "px";
      tip.style.top = Math.max(8, yy - tip.offsetHeight - 10) + "px";
    });
    r.addEventListener("mouseleave", ()=>{ tip.style.opacity = "0"; });
  });

  card.appendChild(el("div",{class:"legend"}, CATS.map(c =>
    el("span",null, el("i",{style:"background:"+c.cor}), c.label))));
  return card;
}

function escalaBonita(max){
  const bruto = max/4;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(bruto,1))));
  const n = bruto/mag;
  const passo = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return passo*mag;
}
const curto = v => v >= 1000 ? (v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+"k" : v.toLocaleString("pt-BR",{maximumFractionDigits:0});

/* ======================= INTELIGÊNCIA =======================
   consumo médio diário → cobertura em dias → ponto de pedido.
   Item embalado consome pela venda; granel consome pela
   transferência ao balcão, único ponto onde o sabor é conhecido. */

function analiseProdutos(janelaDias){
  const dias = Math.max(1, Number(janelaDias) || Number(state.config.janela) || 30);
  const fim = new Date(); const ini = new Date(); ini.setDate(ini.getDate() - (dias-1));
  const de = ini.toISOString().slice(0,10), ate = fim.toISOString().slice(0,10);
  const base = state.demo ? demoMovimentos() : state.movimentos;
  const movs = base.filter(m => { const d = dataDoMov(m); return d >= de && d <= ate; });

  const prods = state.demo ? demoProdutos() : produtosAtivos();
  const byId = {}; prods.forEach(p => byId[p.id] = p);
  const consumo = {}, porDia = {};
  for (const m of movs){
    const cat = catDe(m); if (!cat) continue;
    const d = dataDoMov(m);
    for (const sku in (m.itens||{})){
      const p = byId[sku]; if (!p) continue;
      const q = Number(m.itens[sku])||0;
      const conta = isGranel(p) ? (cat === "transf") : (cat !== "transf");
      if (!conta) continue;
      consumo[sku] = (consumo[sku]||0) + q;
      (porDia[sku] = porDia[sku] || {})[d] = (porDia[sku][d]||0) + q;
    }
  }

  const s = calcSaldos();
  const leadPadrao = Number(state.config.leadTime)||15;
  const alvo = Number(state.config.coberturaAlvo)||30;

  const linhas = prods.map(p => {
    const total = consumo[p.id]||0;
    const diario = total / dias;
    const saldo = (s.fechado[p.id]||0) + (isGranel(p) ? 0 : (s.balcao[p.id]||0));
    const lead = Number(p.leadTime) > 0 ? Number(p.leadTime) : leadPadrao;
    const cobertura = diario > 0 ? saldo/diario : (saldo > 0 ? Infinity : 0);
    const pontoPedido = diario * lead;
    const min = Number(p.estoqueMin)||0;
    const ideal = diario * (lead + alvo);
    const comprar = Math.max(0, ideal - saldo);
    let status = "ok";
    if (diario > 0 || min > 0){
      if (saldo <= 0) status = "zerado";
      else if ((min > 0 && saldo <= min) || cobertura < lead) status = "critico";
      else if (cobertura < lead + 7) status = "atencao";
    }
    if (diario === 0 && saldo > 0) status = "parado";
    return { p, total, diario, saldo, lead, cobertura, pontoPedido, min, comprar, status, porDia: porDia[p.id]||{} };
  });
  return { linhas, dias, de, ate };
}

function graficoConsumo(p, A, dias){
  const card = el("div",{class:"chart-card", style:"margin-bottom:0"});
  card.appendChild(el("h3",null,"Consumo por dia"));
  card.appendChild(el("p",{class:"csub"},
    isGranel(p) ? "Para granel, o consumo é o que foi transferido ao balcão." : "Saídas do produto, dia a dia."));

  const serie = [];
  const fim = new Date();
  for (let i = dias-1; i >= 0; i--){
    const d = new Date(fim); d.setDate(d.getDate()-i);
    const k = d.toISOString().slice(0,10);
    serie.push({ data:k, v: A.porDia[k] || 0 });
  }
  const max = Math.max(...serie.map(x=>x.v), 0);
  if (max <= 0){
    card.appendChild(el("div",{class:"empty", style:"padding:22px;margin-top:4px"},
      el("p",{style:"margin:0"},"Sem consumo registrado nos últimos "+dias+" dias.")));
    return card;
  }
  const W = 700, H = 150, ML = 40, MR = 8, MT = 8, MB = 24;
  const iw = W-ML-MR, ih = H-MT-MB;
  const bw = Math.max(2, iw/serie.length - 2);
  const y = v => MT + ih - (v/max)*ih;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Consumo diário">';
  s += '<line x1="'+ML+'" y1="'+MT+'" x2="'+(W-MR)+'" y2="'+MT+'" stroke="var(--line)" stroke-width="1"/>';
  s += '<text x="'+(ML-6)+'" y="'+(MT+4)+'" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">'+fmtBase(p,max)+'</text>';
  serie.forEach((d,i) => {
    const x = ML + i*(iw/serie.length);
    if (d.v > 0){
      const yy = y(d.v);
      s += '<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,(MT+ih)-yy).toFixed(1)+'" rx="2" fill="var(--s1)"><title>'+dataBR(d.data)+': '+fmtBase(p,d.v)+' '+baseUn(p)+'</title></rect>';
    }
  });
  if (A.diario > 0){
    const ym = y(A.diario);
    s += '<line x1="'+ML+'" y1="'+ym+'" x2="'+(W-MR)+'" y2="'+ym+'" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    s += '<text x="'+(W-MR)+'" y="'+(ym-6)+'" text-anchor="end" font-size="10" font-weight="600" fill="var(--accent)" font-family="IBM Plex Mono, monospace">média '+fmtBase(p,A.diario)+'</text>';
  }
  s += '<line x1="'+ML+'" y1="'+(MT+ih)+'" x2="'+(W-MR)+'" y2="'+(MT+ih)+'" stroke="var(--line-strong)" stroke-width="1"/>';
  s += '<text x="'+ML+'" y="'+(H-6)+'" font-size="10" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">'+dataBR(serie[0].data)+'</text>';
  s += '<text x="'+(W-MR)+'" y="'+(H-6)+'" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">'+dataBR(serie[serie.length-1].data)+'</text>';
  s += '</svg>';
  card.innerHTML += s;
  return card;
}

/* ------------------ contagem por planilha ------------------ */

const UNI_ALIAS = {
  kg:"kg", quilo:"kg", quilos:"kg",
  un:"un", und:"un", unid:"un", unidade:"un", unidades:"un", pc:"un", peca:"un",
  cx:"cx", caixa:"cx", caixas:"cx",
  emb:"emb", embalagem:"emb", pct:"emb", pacote:"emb", pacotes:"emb", saco:"emb", sc:"emb",
};

function parseContagemPlanilha(txt){
  const out = [];
  for (const raw of txt.split(/\r?\n/)){
    const linha = raw.trim(); if (!linha) continue;
    let cols = linha.split(/\t|;/).map(c => c.trim().replace(/^"|"$/g,""));
    if (cols.length === 1) cols = linha.split(/\s{2,}|,/).map(c => c.trim());
    if (cols.length === 1) cols = linha.split(/\s+/);
    cols = cols.filter(c => c !== "");
    if (cols.length < 2) continue;
    const c0 = norm(cols[0]);
    if (["codigo","cod","sku","produto","item"].includes(c0)) continue;   // cabeçalho

    let unidade = null;
    const ult = norm(cols[cols.length-1]);
    if (UNI_ALIAS[ult]){ unidade = UNI_ALIAS[ult]; cols.pop(); }
    if (cols.length < 2) continue;

    let qtd = null, idxQtd = -1;
    for (let i = cols.length-1; i >= 1; i--){
      const n = parseNum(cols[i]);
      if (n !== null){ qtd = n; idxQtd = i; break; }
    }
    if (qtd === null) continue;

    const codigo = cols[0];
    const nome = idxQtd > 1 ? cols.slice(1, idxQtd).join(" ") : "";
    out.push({ codigo, nome, qtd, unidade });
  }
  return out;
}

function fatorPara(p, unidade){
  const meds = medidas(p);
  if (!unidade) return { fator: 1, ok: true };
  if (unidade === baseUn(p)) return { fator: 1, ok: true };
  const m = meds.find(x => x.nome === unidade);
  if (m) return { fator: m.fator, ok: true };
  return { fator: 1, ok: false };
}

function mapearContagem(linhas){
  const itens = {}; const pendentes = []; const semConversao = [];
  for (const L of linhas){
    const p = produtoPorCodigo(L.codigo) || produtoPorNome(L.nome) || produtoPorNome(L.codigo);
    if (!p){ pendentes.push({ codigo:L.codigo, nome:L.nome, qtd:L.qtd, un:L.unidade||"" }); continue; }
    const f = fatorPara(p, L.unidade);
    if (!f.ok) semConversao.push({ p, unidade:L.unidade });
    itens[p.id] = L.qtd * f.fator;
  }
  return { itens, pendentes, semConversao };
}

function resumoContagem(itens){
  let kg = 0, un = 0;
  for (const sku in itens){
    const p = produtoPorId(sku); const v = Number(itens[sku])||0;
    if (!p || isGranel(p)) kg += v; else un += v;
  }
  return nKg1(kg)+" kg · "+nUn(un)+" un";
}

function countRow(p, itens, esperadoMap){
  const meds = medidas(p);
  const val = itens[p.id];
  const temValor = val !== undefined && val !== null && val !== "";
  const esperado = esperadoMap[p.id];
  const dif = temValor && esperado !== undefined ? (Number(val) - Number(esperado)) : null;

  const row = el("div",{class:"crow" + (temValor ? (dif !== null && Math.abs(dif) > 0.0005 ? " diff" : " done") : "")});
  const sm = el("div",{class:"sm"},
    el("span",{class:"mono"}, p.codigo || p.id),
    isGranel(p) ? el("span",{class:"chip gran"},"granel") : null,
    state.cega ? null : el("span",null,"sistema: "+(esperado===undefined ? "—" : fmtBase(p,esperado)+" "+baseUn(p))),
    (!state.cega && dif !== null && Math.abs(dif) > 0.0005)
      ? el("span",{class:"chip "+(dif<0?"crit":"warn")}, (dif>0?"+":"")+fmtBase(p,dif)) : null);
  row.appendChild(el("div",{class:"meta", style:"display:flex;align-items:center;gap:10px"},
    thumb(p, 38), el("div",{style:"min-width:0"}, el("div",{class:"nm"}, p.nome), sm)));

  let medida = meds[0];
  const input = el("input",{type:"text", inputmode:"decimal", placeholder:"0", "aria-label":"Quantidade de "+p.nome});
  if (temValor) input.value = fmtBase(p, val);
  const aplicar = () => {
    const n = parseNum(input.value);
    if (input.value.trim() === "") delete itens[p.id];
    else if (n !== null) itens[p.id] = n * (Number(medida.fator)||1);
    atualizaRow(row, sm, p, itens, esperadoMap);
    atualizaProgresso(itens);
    agendarAutosave();
  };
  input.addEventListener("focus", ()=> input.select());
  input.addEventListener("input", aplicar);
  input.addEventListener("blur", ()=>{
    const n = parseNum(input.value);
    if (n !== null && medida.fator === 1) input.value = fmtBase(p, n);
  });

  let ctrl;
  if (meds.length > 1){
    const sel = el("select",{"aria-label":"Unidade de contagem"}, ...meds.map(m => el("option",{value:m.nome}, m.label || m.nome)));
    sel.addEventListener("change", ()=>{ medida = meds.find(m=>m.nome===sel.value)||meds[0]; aplicar(); input.focus(); });
    ctrl = sel;
  } else {
    ctrl = el("span",{class:"u"}, baseUn(p));
  }
  row.appendChild(el("div",{class:"qty"}, input, ctrl));
  return row;
}

function atualizaRow(row, sm, p, itens, esperadoMap){
  const val = itens[p.id];
  const temValor = val !== undefined;
  const esperado = esperadoMap[p.id];
  const dif = temValor && esperado !== undefined ? (Number(val) - Number(esperado)) : null;
  row.className = "crow" + (temValor ? (dif !== null && Math.abs(dif) > 0.0005 ? " diff" : " done") : "");
  const chip = sm.querySelector(".chip.crit, .chip.warn");
  if (chip) chip.remove();
  if (!state.cega && dif !== null && Math.abs(dif) > 0.0005)
    sm.appendChild(el("span",{class:"chip "+(dif<0?"crit":"warn")}, (dif>0?"+":"")+fmtBase(p,dif)));
}

function atualizaProgresso(itens){
  const total = produtosAtivos().length;
  const n = Object.keys(itens).length;
  const info = $("#barInfo"); if (info) info.textContent = n+"/"+total+" contados";
  const bar = $("#app .progress-bar i"); if (bar) bar.style.width = (total?Math.round(n/total*100):0)+"%";
  const label = $("#progLabel"); if (label) label.textContent = n+" de "+total+" produtos contados";
  const kg = $("#progKg"); if (kg) kg.textContent = resumoContagem(itens);
}

async function baixarBackup(){
  if (!requireDb()) return;
  const dados = await exportarTudo();
  const txt = JSON.stringify(dados, null, 1);
  const nome = "backup-fini-" + hoje() + ".json";
  let dl = null;
  try { dl = await window.claude?.use?.("downloads"); } catch(e){}
  if (dl){ try { await dl.save({filename:nome, data:txt}); toast("Backup gerado."); return; } catch(e){} }
  try {
    const blob = new Blob([txt], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast("Backup gerado."); return;
  } catch(e){}
  const md = el("div",{class:"modal", style:"max-width:700px"});
  md.appendChild(el("h2",null,"Copiar backup"));

  md.appendChild(el("div",{class:"modal-actions"}, el("button",{class:"btn primary", onclick:closeModal},"Fechar")));
  openModal(md); ta.select();

/* modais empilham: abrir um por cima não destrói o de baixo */
function openModal(node){
  const root = $("#modalRoot");
  const bg = el("div",{class:"modal-bg", onclick:(e)=>{ if (e.target === bg) closeModal(); }}, node);
  bg.style.zIndex = String(80 + root.children.length*2);
  root.appendChild(bg);
  document.addEventListener("keydown", escClose);
  const f = node.querySelector("input,textarea,select"); if (f) f.focus();
}
function closeModal(){
  const root = $("#modalRoot");
  if (root.lastElementChild) root.lastElementChild.remove();
  if (!root.children.length) document.removeEventListener("keydown", escClose);
}
function escClose(e){ if (e.key === "Escape") closeModal(); }

function parseImportProdutos(txt){
  const linhas = txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out = [];
  for (const linha of linhas){
    const cols = linha.split(/\t|;/).map(c => c.trim().replace(/^"|"$/g,""));
    const c0 = norm(cols[0]);
    if (c0 === "codigo" || c0 === "cod" || c0 === "sku") continue;
    if (cols.length < 2) continue;
    const [codigo, nome, categoria, custoRaw, tipoRaw, cxRaw, pesoRaw] = cols;
    if (!nome) continue;
    const t = norm(tipoRaw||"");
    const tipo = t.startsWith("gran") || t === "kg" ? "granel" : (t ? "item" : (norm(nome).includes("granel") ? "granel" : "item"));
    const cod = codigo || slug(nome);
    out.push({ id: slug(cod), codigo: cod, nome, categoria: categoria || CAT_FALLBACK,
      custo: parseNum(custoRaw) || 0, tipo, unPorCaixa: parseNum(cxRaw)||0, pesoUn: parseNum(pesoRaw)||0, ativo:true });
  }
  return out;
}

      closeModal(); toast(n+" produtos importados"+(erros?" · "+erros+" falharam":"")+".");
    }},"Importar")));

    if (d !== null && Math.abs(d) > 0.0005){ difR += d * (Number(p.custo)||0); linhas.push({p,esp,v,d}); }

  linhas.sort((a,b)=> Math.abs(b.d*(Number(b.p.custo)||0)) - Math.abs(a.d*(Number(a.p.custo)||0)));

        el("td",{class:"r num"}, nBRL(L.d*(Number(L.p.custo)||0)))));

  }
  md.appendChild(el("div",{class:"modal-actions"},

    el("button",{class:"btn danger", onclick:()=>descartarContagem(c)},"Descartar")));
  openModal(md);
}

function modalDetalheContagem(c){
  const md = el("div",{class:"modal", style:"max-width:640px"});
  md.appendChild(el("h2",null,(c.tipo==="balcao"?"Balcão":"Estoque fechado")+" · "+dataBR(c.criadoEm)));
  md.appendChild(el("p",{class:"lead"},"Aplicada em "+dataHoraBR(c.aplicadaEm)+(c.responsavel?" por "+c.responsavel:"")));
  const itens = Object.entries(c.itens||{}).sort((a,b)=>{
    const na = (produtoPorId(a[0])||{}).nome || a[0], nb = (produtoPorId(b[0])||{}).nome || b[0];
    return na.localeCompare(nb,"pt-BR");
  });
  const tb = el("tbody");
  for (const [sku,q] of itens){
    const p = produtoPorId(sku);
    tb.appendChild(el("tr",null, el("td",null, p?p.nome:sku), el("td",{class:"code"}, p?p.codigo:""), el("td",{class:"r num"}, (p?fmtBase(p,q):nUn(q))+" "+(p?baseUn(p):""))));
  }
  md.appendChild(el("div",{class:"table-wrap", style:"max-height:360px;overflow-y:auto"},
    el("table",{style:"min-width:420px"}, el("thead",null,el("tr",null,el("th",null,"Produto"),el("th",null,"Código"),el("th",{class:"r"},"Qtde"))), tb)));
  md.appendChild(el("div",{class:"modal-actions"}, el("button",{class:"btn ghost", onclick:closeModal},"Fechar")));
  openModal(md);
}

/* ============================ export ============================ */

async function baixarCSV(rows, nome){
  const csv = "﻿" + rows.map(l => l.map(c => '"'+String(c===undefined?"":c).replace(/"/g,'""')+'"').join(";")).join("\n");
  let dl = null;
  try { dl = await window.claude?.use?.("downloads"); } catch(e){}
  if (dl){ try { await dl.save({filename:nome, data:csv}); toast("CSV gerado."); return; } catch(e){} }
  try {
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast("CSV gerado."); return;
  } catch(e){}
  const md = el("div",{class:"modal", style:"max-width:700px"});
  md.appendChild(el("h2",null,"Copiar planilha"));
  md.appendChild(el("p",{class:"lead"},"Selecione tudo e cole no Excel — as colunas já vêm separadas por ponto e vírgula."));
  const ta = el("textarea",{style:"min-height:250px"}); ta.value = csv.replace("﻿","");
  md.appendChild(el("div",{class:"field"}, ta));
  md.appendChild(el("div",{class:"modal-actions"}, el("button",{class:"btn primary", onclick:closeModal},"Fechar")));
  openModal(md); ta.select();
}

async function exportarCSV(prods, s){
  const linhas = [["codigo","produto","categoria","tipo","unidade","fechado","balcao","total","custo_unit","valor_total"]];
  for (const p of ordenados(prods)){
    const gran = isGranel(p);
    const f = s.fechado[p.id]||0;
    const b = gran ? (s.granelNaContagem[p.id]||0) : (s.balcao[p.id]||0);
    const t = f + (gran ? 0 : b), cu = Number(p.custo)||0;
    const dec = gran ? 3 : 2;
    linhas.push([p.codigo||p.id, p.nome, p.categoria||CAT_FALLBACK, gran?"granel":"item", baseUn(p),
      f.toFixed(dec).replace(".",","), b.toFixed(dec).replace(".",","), t.toFixed(dec).replace(".",","),
      cu.toFixed(2).replace(".",","), (t*cu).toFixed(2).replace(".",",")]);
  }
  linhas.push([]);
  linhas.push([POOL_NOME+" (balcão)","","","","kg", "", s.poolGranel.toFixed(3).replace(".",","), "", "", ""]);
  await baixarCSV(linhas, "estoque-fini-"+hoje()+".csv");
}
